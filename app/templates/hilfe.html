{% extends "basis.html" %}
{% block titel %}{{ titel }} — OPERA XRechnung{% endblock %}
{% block inhalt %}
<div class="hilfe">
  <aside class="karte inhalt">
    <nav class="hilfe-wechsel">
      <a href="/hilfe" class="{{ 'aktiv' if seite == 'handbuch' }}">Handbuch</a>
      <a href="/hilfe/installation" class="{{ 'aktiv' if seite == 'installation' }}">Installation</a>
    </nav>
    <h2>Inhalt</h2>
    <ul class="verzeichnis">
      {% for ebene, text, anker in verzeichnis %}
      <li class="e{{ ebene }}"><a href="#{{ anker }}">{{ text }}</a></li>
      {% endfor %}
    </ul>
  </aside>
  <article class="karte text">{{ text|safe }}</article>
</div>
{% endblock %}
